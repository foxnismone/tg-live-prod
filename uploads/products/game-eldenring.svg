<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F3F4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AC8417"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Tarjeta del producto -->
  <rect x="30" y="30" width="540" height="540" rx="12" fill="url(#card)" opacity="0.08"/>
  <rect x="30" y="30" width="540" height="540" rx="12" fill="none" stroke="#AC8417" stroke-width="2" opacity="0.3"/>

  <!-- Icono del producto -->
  <text x="300" y="200" font-size="120" text-anchor="middle" dominant-baseline="central">⚔️</text>

  <!-- Marca -->
  <text x="300" y="280" font-size="22" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#AC8417" text-anchor="middle">FromSoftware</text>

  <!-- Nombre -->
  <text x="300" y="310" font-size="18" font-weight="500" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="middle">Elden Ring: Shadow of the Erdtree</text>

  <!-- Línea separadora -->
  <line x1="80" y1="325" x2="520" y2="325" stroke="#D2D7DC" stroke-width="1"/>

  <!-- Especificaciones -->
  
    <text x="40" y="340" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">Género</text>
    <text x="560" y="340" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">Acción RPG / Soulslike</text>
  
    <text x="40" y="362" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">Plataformas</text>
    <text x="560" y="362" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">PC, PS5, Xbox Series X|S</text>
  
    <text x="40" y="384" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">Clasificación</text>
    <text x="560" y="384" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">M (Maduro 17+)</text>
  
    <text x="40" y="406" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">Modo</text>
    <text x="560" y="406" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">Un jugador, cooperativo online</text>
  
    <text x="40" y="428" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">Idioma</text>
    <text x="560" y="428" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">Español (textos y audio)</text>
  

  <!-- Marca de agua -->
  <text x="300" y="560" font-size="14" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#BEC5CC" text-anchor="middle">TecnoGamer</text>
</svg>
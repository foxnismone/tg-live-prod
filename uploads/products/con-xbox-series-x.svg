<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F3F4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#107C10"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Tarjeta del producto -->
  <rect x="30" y="30" width="540" height="540" rx="12" fill="url(#card)" opacity="0.08"/>
  <rect x="30" y="30" width="540" height="540" rx="12" fill="none" stroke="#107C10" stroke-width="2" opacity="0.3"/>

  <!-- Icono del producto -->
  <text x="300" y="200" font-size="120" text-anchor="middle" dominant-baseline="central">🟩</text>

  <!-- Marca -->
  <text x="300" y="280" font-size="22" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#107C10" text-anchor="middle">Microsoft</text>

  <!-- Nombre -->
  <text x="300" y="310" font-size="18" font-weight="500" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="middle">Xbox Series X 1TB</text>

  <!-- Línea separadora -->
  <line x1="80" y1="325" x2="520" y2="325" stroke="#D2D7DC" stroke-width="1"/>

  <!-- Especificaciones -->
  
    <text x="40" y="340" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">CPU</text>
    <text x="560" y="340" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">AMD Zen 2, 8 núcleos @ 3.8 GHz</text>
  
    <text x="40" y="362" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">GPU</text>
    <text x="560" y="362" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">12 TFLOPS, 52 CUs</text>
  
    <text x="40" y="384" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">RAM</text>
    <text x="560" y="384" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">16 GB GDDR6</text>
  
    <text x="40" y="406" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">SSD</text>
    <text x="560" y="406" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">1 TB NVMe (Velocity)</text>
  
    <text x="40" y="428" font-size="13" font-family="Ubuntu, Arial, sans-serif" fill="#8F9CA3">Resolución</text>
    <text x="560" y="428" font-size="13" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#42474A" text-anchor="end">4K 120 Hz, 8K</text>
  

  <!-- Marca de agua -->
  <text x="300" y="560" font-size="14" font-weight="700" font-family="Ubuntu, Arial, sans-serif" fill="#BEC5CC" text-anchor="middle">TecnoGamer</text>
</svg>
name: CI/CD TecnoGamer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Syntax check
        run: |
          node -c backend/server.js
          node -c backend/config/database.js
          node -c backend/routes/products.js
          node -c backend/routes/orders.js
          node -c backend/routes/auth.js
          node -c frontend/assets/js/store.js
          node -c frontend/assets/js/admin.js

      - name: Start server
        run: |
          node backend/server.js &
          sleep 5

      - name: API tests
        run: node tools/api-tests.js

      - name: E2E tests
        run: node tools/e2e-tests.js

      - name: Deep QA
        run: node tools/deep-qa.js

      - name: Verify theme
        run: node tools/verify-theme.js

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: |
            tools/*-report.json
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

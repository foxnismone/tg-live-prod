<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="50%" style="stop-color:#7b2ffc"/>
      <stop offset="100%" style="stop-color:#ff0055"/>
    </linearGradient>
    <linearGradient id="gamerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="100%" style="stop-color:#7b2ffc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#00f5ff" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Grid de fondo estilo computadora -->
  <g opacity="0.15">
    <line x1="40" y1="100" x2="360" y2="100" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="40" y1="150" x2="360" y2="150" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="40" y1="200" x2="360" y2="200" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="40" y1="250" x2="360" y2="250" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="40" y1="300" x2="360" y2="300" stroke="#00f5ff" stroke-width="0.5"/>
    
    <line x1="100" y1="40" x2="100" y2="360" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="160" y1="40" x2="160" y2="360" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="220" y1="40" x2="220" y2="360" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="280" y1="40" x2="280" y2="360" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="340" y1="40" x2="340" y2="360" stroke="#00f5ff" stroke-width="0.5"/>
  </g>

  <!-- Círculos orbitales -->
  <ellipse cx="200" cy="200" rx="160" ry="60" fill="none" stroke="#7b2ffc" stroke-width="0.5" opacity="0.3" transform="rotate(-30, 200, 200)"/>
  <ellipse cx="200" cy="200" rx="140" ry="50" fill="none" stroke="#00f5ff" stroke-width="0.3" opacity="0.2" transform="rotate(20, 200, 200)"/>

  <!-- Ícono de gamepad central -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <!-- Body del gamepad -->
    <rect x="-60" y="-40" width="120" height="80" rx="20" ry="20" fill="none" stroke="url(#neonGrad)" stroke-width="3"/>
    
    <!-- D-pad izquierdo -->
    <rect x="-45" y="-15" width="20" height="20" rx="3" fill="#00f5ff" opacity="0.9"/>
    <rect x="-35" y="-25" width="20" height="20" rx="3" fill="#00f5ff" opacity="0.9"/>
    <rect x="-45" y="-5" width="20" height="20" rx="3" fill="#00f5ff" opacity="0.9"/>
    <rect x="-55" y="-15" width="20" height="20" rx="3" fill="#00f5ff" opacity="0.9"/>
    
    <!-- Botones derechos -->
    <circle cx="35" cy="-15" r="6" fill="#7b2ffc" opacity="0.9"/>
    <circle cx="50" cy="-15" r="6" fill="#ff0055" opacity="0.9"/>
    <circle cx="35" cy="0" r="6" fill="#00f5ff" opacity="0.9"/>
    <circle cx="50" cy="0" r="6" fill="#7b2ffc" opacity="0.9"/>
    
    <!-- Stick central izquierdo -->
    <circle cx="-15" cy="25" r="8" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.7"/>
    <circle cx="-15" cy="25" r="3" fill="#00f5ff" opacity="0.9"/>
    
    <!-- Stick central derecho -->
    <circle cx="15" cy="25" r="8" fill="none" stroke="#7b2ffc" stroke-width="2" opacity="0.7"/>
    <circle cx="15" cy="25" r="3" fill="#7b2ffc" opacity="0.9"/>
  </g>

  <!-- Partículas flotantes -->
  <circle cx="120" cy="150" r="2" fill="#00f5ff" opacity="0.6">
    <animate attributeName="cy" values="150;140;150" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="140" r="1.5" fill="#7b2ffc" opacity="0.7">
    <animate attributeName="cy" values="140;130;140" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="270" r="2.5" fill="#ff0055" opacity="0.5">
    <animate attributeName="cy" values="270;260;270" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="280" r="1.8" fill="#00f5ff" opacity="0.6">
    <animate attributeName="cy" values="280;270;280" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="100" r="1.5" fill="#7b2ffc" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="310" r="1.5" fill="#00f5ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Linterna de datos -->
  <g opacity="0.4">
    <line x1="80" y1="180" x2="200" y2="200" stroke="#00f5ff" stroke-width="0.5" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="170" x2="200" y2="200" stroke="#7b2ffc" stroke-width="0.5" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Texto TecnoGamer -->
  <text x="200" y="370" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="3">
    <tspan fill="#00f5ff">TECHNO</tspan><tspan fill="url(#gamerGrad)">GAMER</tspan>
  </text>
  
  <!-- Subtexto -->
  <text x="200" y="388" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" letter-spacing="5" fill="#ffffff" opacity="0.5">
    GAMING · TECNOLOGÍA · DIVERSIÓN
  </text>
</svg>

services:
  - type: web
    name: tecnogamer
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/tecnogamer.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: BACKUP_DIR
        value: /data/backups
      - key: SITE_URL
        sync: false
      - key: SITE_NAME
        value: TecnoGamer
      - key: CORS_ORIGIN
        sync: false
